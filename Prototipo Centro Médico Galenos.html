<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototipo Centro Médico Galenos</title>
  <style>
    body{margin:0;background:#eff4f7;color:#20354a;font:16px/1.6 "Segoe UI",Arial,sans-serif}
    main{max-width:1000px;margin:55px auto;padding:35px}
    header{display:grid;grid-template-columns:1.1fr 1fr;gap:35px;align-items:center}
    img{width:100%;border-radius:15px}
    small{font-size:11px;letter-spacing:2px;color:#207f7d;font-weight:700}
    h1{font-size:40px;line-height:1.15;letter-spacing:-1px}
    p{color:#647585}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0}
    .actions a{display:block;padding:14px 20px;border-radius:9px;background:#155f86;color:white;text-decoration:none;font-weight:600}
    a:focus-visible{outline:3px solid #e7a92e;outline-offset:4px}
    @media(max-width:700px){main{padding:22px;margin:20px auto}header{grid-template-columns:1fr}h1{font-size:33px}header img{max-height:220px;object-fit:cover}}
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <small>SGMG · CENTRO MÉDICO GALENOS</small>
        <h1>Prototipo<br>Centro Médico Galenos</h1>
        <p>Gestiona reservas, agendas y atención desde una misma aplicación.</p>
        <div class="actions"><a href="Aplicacion/index.html">Abrir aplicación</a></div>
      </div>
      <img src="Aplicacion/galenos.jpg" alt="Fachada del Centro Médico Galenos">
    </header>
  </main>
</body>
</html>
